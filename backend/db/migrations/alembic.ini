# ==============================================================================
# Alembic Configuration for MASDS Database Migrations
# ==============================================================================

[alembic]
# Path to migration scripts (relative to backend directory or alembic execution root)
script_location = db/migrations

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Sys.path prepending
prepend_sys_path = .

# Version locations
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Default database connection string (can be overridden via DATABASE_URL env var)
sqlalchemy.url = postgresql+asyncpg://masds:masds@localhost:5432/masds

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
