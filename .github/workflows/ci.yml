name: MASDS CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Backend Testing & Code Coverage
  # ============================================================================
  test-backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masds
          POSTGRES_PASSWORD: masds
          POSTGRES_DB: masds
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://masds:masds@localhost:5432/masds
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: mock-ci-test-key
      ANTHROPIC_API_KEY: mock-ci-test-key
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov pytest-asyncio httpx aiosqlite

      - name: Run Backend Pytest Suite with Coverage
        run: |
          pytest backend/tests/ -v --tb=short --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # ============================================================================
  # Frontend Linting & Build Verification
  # ============================================================================
  test-frontend:
    name: Frontend Lint & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ${{ hashFiles('frontend/package.json') != '' && 'frontend' || '.' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        working-directory: ${{ hashFiles('frontend/package.json') != '' && 'frontend' || '.' }}
        run: |
          npm run lint --if-present

      - name: Run Next.js Production Build
        working-directory: ${{ hashFiles('frontend/package.json') != '' && 'frontend' || '.' }}
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build --if-present

  # ============================================================================
  # Docker Container Builds
  # ============================================================================
  docker-build:
    name: Docker Image Build (${{ matrix.component }})
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: masds-backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: masds-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: false
          tags: ${{ matrix.component.image }}:latest,${{ matrix.component.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
